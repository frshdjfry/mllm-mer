[project]
name = "gemini-batch-audio-cli"
version = "0.1.0"
description = "Small CLI for running Gemini batch experiments over audio files in GCS."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "google-genai>=1.20.0",
  "google-cloud-storage>=2.16.0",
  "PyYAML>=6.0.1",
]

[project.optional-dependencies]
# Only needed where the music-flamingo runner itself runs (the GPU machine).
# For the exact tested versions use requirements-music-flamingo.txt.
music-flamingo = [
  "torch==2.11.0",
  "transformers @ git+https://github.com/huggingface/transformers@aadc005711da266af1f75c33185172af9d9f19bf",
  "accelerate==1.13.0",
  "librosa==0.11.0",
  "soundfile==0.13.1",
]

[project.scripts]
gemini-batch-audio = "cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
